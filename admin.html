<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - useas Courses</title>
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Ambient Glow Orbs -->
    <div class="ambient-orb-1"></div>
    <div class="ambient-orb-2"></div>

    <!-- Admin Access Login Gate -->
    <div id="adminLoginGate" class="modal-overlay active" style="z-index: 5000; background: rgba(15, 23, 42, 0.85);">
        <div class="auth-card" style="max-width: 440px; padding: 2.5rem 2rem; text-align: center;">
            <div class="brand-logo" style="width: 56px; height: 56px; font-size: 1.5rem; margin: 0 auto 1rem auto; background: linear-gradient(135deg, var(--accent-cyan), var(--primary));">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="auth-title" style="font-size: 1.6rem;">Admin Portal Access</h2>
            <p class="auth-subtitle" style="margin-bottom: 1.5rem;">Sign in with administrator credentials to manage courses and students.</p>

            <div id="adminLoginError" class="auth-error-box" style="display: none; text-align: left;"></div>

            <form id="adminLoginForm" class="auth-form" style="text-align: left;">
                <div class="form-group">
                    <label class="form-label" for="adminLoginEmailInput">
                        <i class="fa-solid fa-envelope"></i> Admin Email / Name
                    </label>
                    <input type="text" id="adminLoginEmailInput" class="form-input" placeholder="ssrdevelopers@gmail.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminLoginPasswordInput">
                        <i class="fa-solid fa-lock"></i> Admin Password
                    </label>
                    <input type="password" id="adminLoginPasswordInput" class="form-input" placeholder="Enter admin password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    <i class="fa-solid fa-right-to-bracket"></i> Unlock Admin Console
                </button>
            </form>

            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #f1f5f9;">
                <a href="index.html" style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">
                    <i class="fa-solid fa-arrow-left"></i> Back to Student Portal
                </a>
            </div>
        </div>
    </div>

    <!-- Header / Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="admin.html" class="brand">
                <div class="brand-logo" style="background: linear-gradient(135deg, var(--accent-cyan), var(--primary));">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="brand-text-group">
                    <div class="brand-text">useas</div>
                    <div class="brand-subtext"><span class="subtext-dot"></span> ADMIN CONSOLE</div>
                </div>
            </a>
            
            <div class="nav-actions" style="gap: 0.75rem; flex-wrap: wrap;">
                <span class="cloud-badge" title="Firebase Realtime Database Connected" style="font-size: 0.78rem; font-weight: 700; color: var(--accent-green); background: rgba(16, 185, 129, 0.1); padding: 0.35rem 0.75rem; border-radius: var(--radius-full); border: 1px solid rgba(16, 185, 129, 0.25);">
                    <i class="fa-solid fa-cloud-check"></i> Synced
                </span>

                <!-- Admin Profile & Settings Button -->
                <button id="openAdminSettingsBtn" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.85rem 0.35rem 0.45rem; border-radius: var(--radius-full);">
